name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        # Si tu proyecto está en la raíz, borra la línea de abajo. 
        # Si está dentro de una subcarpeta, pon el nombre de la carpeta aquí:
        # working-directory: ./nombre-de-la-carpeta

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lopi-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
